<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Solution Group | We do water different.</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="assets/logos/sg_icon-navy.svg">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.js"></script>
<script src="js/ds-bundle.js"></script>
<style>@keyframes sg-pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes sg-fade{from{opacity:0}to{opacity:1}}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="js/Site.jsx" data-presets="react"></script>
<script type="text/babel" src="js/HomeScreen.jsx" data-presets="react"></script>
<script type="text/babel" src="js/ServicesScreen.jsx" data-presets="react"></script>
<script type="text/babel" src="js/Pages.jsx" data-presets="react"></script>
<script type="text/babel" src="js/OptiClearScreen.jsx" data-presets="react"></script>
<script type="text/babel" src="js/ContactScreen.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [route,setRoute]=React.useState('home');
  const go=(r)=>{setRoute(r);window.scrollTo({top:0});};
  React.useEffect(()=>{if(window.lucide)window.lucide.createIcons({nameAttr:'data-lucide'});},[route]);
  const Screen={home:HomeScreen,services:ServicesScreen,opticlear:OptiClearScreen,industries:IndustriesScreen,careers:CareersScreen,about:AboutScreen,news:NewsScreen,contact:ContactScreen}[route];
  return <React.Fragment>
    <SiteHeader route={route} go={go}/>
    <main><Screen go={go}/></main>
    <SiteFooter go={go}/>
  </React.Fragment>;
}
let tries=0;
(function wait(){
  if(window.HomeScreen&&window.ServicesScreen&&window.OptiClearScreen&&window.ContactScreen&&window.SiteHeader&&window.IndustriesScreen&&window.CareersScreen&&window.AboutScreen&&window.NewsScreen)
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  else if(++tries>100){
    const missing=['SiteHeader','HomeScreen','ServicesScreen','OptiClearScreen','ContactScreen','IndustriesScreen','CareersScreen','AboutScreen','NewsScreen'].filter(n=>!window[n]);
    console.error('UI kit failed to boot. Missing:',missing.join(', '),'| design system bundle loaded:',!!window.SolutionGroupDesignSystem_441f31);
    document.getElementById('root').innerHTML='<div style="padding:48px;font:16px var(--font-core);color:var(--status-alarm)">Failed to load: '+missing.join(', ')+'</div>';
  }
  else setTimeout(wait,40);
})();
</script>
</body></html>
